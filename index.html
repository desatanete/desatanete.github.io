<!-- Hero Section (Slider/Geser) -->
  <header class="relative h-screen bg-black overflow-hidden">
    
    <!-- Kontainer Slider Utama (Gambar & Teks) -->
    <div id="hero-slider" class="relative w-full h-full flex transition-transform duration-700 ease-in-out z-10">
      
      <!-- === Slide 1 === -->
      <!-- Gambar Latar untuk Slide 1 (Ganti URL dengan gambar Anda) -->
      <div class="w-full h-full flex-shrink-0 relative bg-cover bg-center" 
           style="background-image: url('assets/desa.jpg');">
        
        <!-- Overlay Gelap (Agar teks terbaca) -->
        <div class="absolute inset-0 bg-black/50"></div>
        
        <!-- Konten Teks Slide 1 -->
        <div class="relative z-20 w-full h-full flex flex-col items-center justify-center text-center text-white px-4">
          <h1 class="text-4xl md:text-6xl font-bold mb-4">Selamat Datang di Desa Tanete</h1>
          <p class="text-lg md:text-2xl">Desa Mandiri dan Berkelanjutan di Kabupaten Sidrap</p>
        </div>
      </div>

      <!-- === Slide 2 === -->
      <!-- Gambar Latar untuk Slide 2 (Ganti URL dengan gambar Anda) -->
      <div class="w-full h-full flex-shrink-0 relative bg-cover bg-center" 
           style="background-image: url('https://images.unsplash.com/photo-1596431913166-410a8d67a149?q=80&w=2070');">
           <!-- Contoh menggunakan URL Unsplash untuk testing -->

        <!-- Overlay Gelap (Agar teks terbaca) -->
        <div class="absolute inset-0 bg-black/50"></div>
        
        <!-- Konten Teks Slide 2 -->
        <div class="relative z-20 w-full h-full flex flex-col items-center justify-center text-center text-white px-4">
          <h1 class="text-4xl md:text-6xl font-bold mb-4">Potensi Pertanian Unggul</h1>
          <p class="text-lg md:text-2xl">Meningkatkan Kesejahteraan Melalui Inovasi Tani</p>
        </div>
      </div>

      <!-- === Slide 3 === -->
      <!-- Gambar Latar untuk Slide 3 (Ganti URL dengan gambar Anda) -->
      <div class="w-full h-full flex-shrink-0 relative bg-cover bg-center" 
           style="background-image: url('https://images.unsplash.com/photo-1568991206894-39ac150824b0?q=80&w=2070');">
           <!-- Contoh menggunakan URL Unsplash untuk testing -->

        <!-- Overlay Gelap (Agar teks terbaca) -->
        <div class="absolute inset-0 bg-black/60"></div>
        
        <!-- Konten Teks Slide 3 -->
        <div class="relative z-20 w-full h-full flex flex-col items-center justify-center text-center text-white px-4">
          <h1 class="text-4xl md:text-6xl font-bold mb-4">Masyarakat Harmonis</h1>
          <p class="text-lg md:text-2xl">Menjaga Tradisi, Merangkul Masa Depan</p>
        </div>
      </div>

    </div>

    <!-- Tombol Navigasi Manual (Kiri & Kanan) -->
    <button id="prev-slide" class="absolute left-4 top-1/2 transform -translate-y-1/2 z-30 bg-white/20 hover:bg-white/40 text-white p-3 rounded-full backdrop-blur-sm transition">
      &#10094;
    </button>
    <button id="next-slide" class="absolute right-4 top-1/2 transform -translate-y-1/2 z-30 bg-white/20 hover:bg-white/40 text-white p-3 rounded-full backdrop-blur-sm transition">
      &#10095;
    </button>

    <!-- Indikator Titik Posisi Slider -->
    <div class="absolute bottom-8 left-1/2 transform -translate-x-1/2 z-30 flex space-x-2">
      <div class="dot w-3 h-3 rounded-full bg-white cursor-pointer transition-colors" onclick="goToSlide(0)"></div>
      <div class="dot w-3 h-3 rounded-full bg-white/50 cursor-pointer transition-colors" onclick="goToSlide(1)"></div>
      <div class="dot w-3 h-3 rounded-full bg-white/50 cursor-pointer transition-colors" onclick="goToSlide(2)"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </header>
